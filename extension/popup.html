<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a1d21; background: #fff; }
    header { padding: 14px 16px 10px; border-bottom: 1px solid #e3e8ee; }
    h1 { font-size: 15px; margin: 0; }
    .count { color: #5c6670; font-size: 12px; margin-top: 2px; }
    .list { max-height: 360px; overflow-y: auto; }
    .item { padding: 10px 16px; border-bottom: 1px solid #f0f2f5; }
    .item a { color: #2557d6; text-decoration: none; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { color: #5c6670; font-size: 11px; margin-top: 2px; display: flex; justify-content: space-between; }
    .item .rm { color: #b91c1c; cursor: pointer; }
    .empty { padding: 24px 16px; color: #5c6670; text-align: center; }
    footer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #e3e8ee; }
    button { font: 600 12px/1 inherit; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Jobs you've applied to</h1>
    <div class="count" id="count"></div>
  </header>
  <div class="list" id="list"></div>

  <section style="padding: 12px 16px; border-top: 1px solid #e3e8ee;">
    <div style="font-weight:700; font-size:13px; margin-bottom:4px;">Your resume text</div>
    <div style="color:#5c6670; font-size:11px; margin-bottom:6px;">
      Paste it once. The 🔑 Keywords panel on job pages will then show what you're missing.
    </div>
    <textarea id="resume" placeholder="Paste your resume text here…"
      style="width:100%; box-sizing:border-box; height:90px; font:400 11px/1.4 -apple-system,sans-serif;
             border:1px solid #d0d7de; border-radius:6px; padding:8px; resize:vertical;"></textarea>
    <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
      <button id="saveResume">Save resume</button>
      <span id="resumeStatus" style="color:#15803d; font-size:11px;"></span>
    </div>
  </section>

  <footer>
    <button id="export">Export applied</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" style="display:none" />
  </footer>
  <script src="popup.js"></script>
</body>
</html>
