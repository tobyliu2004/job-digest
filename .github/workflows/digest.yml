name: Job Digest

on:
  # GitHub Actions cron is UTC-only, ignores DST, and routinely DELAYS or DROPS
  # scheduled triggers. To stay reliable we (a) fire many times across the
  # morning and evening windows for any US timezone, at :09 and :39 to dodge the
  # congested top of the hour, and (b) let src/main.py send whenever a digest is
  # "due and not yet sent" (see due_slot). So a dropped on-the-hour trigger is
  # simply covered by the next run in the window; nothing is skipped.
  #
  #   morning window (09:00-noon local) -> 13..19 UTC   (EDT .. PST)
  #   evening window (19:00-23:00 local) -> 23..05 UTC
  #
  # Every 30 minutes, all day. EMAIL VOLUME IS UNCHANGED -- still exactly two a
  # day, at send_hours in config/sources.yaml. An off-hour run only scrapes and
  # banks what it finds in state/seen.json's `pending` queue, so a posting that
  # drops at 10:14am is captured by 10:39 rather than waiting for the 7pm run.
  #
  # Two chances per hour is deliberate and load-bearing, not just for latency.
  # Observed on 2026-08-11: the 13:09 UTC trigger did not fire at all, and the
  # morning digest went out over an hour late -- GitHub drops scheduled runs
  # routinely. Every extra slot in a send window is another chance for a due
  # digest to go out, because `due_slot` sends whenever a slot is due and
  # unsent. Thinning this to hourly would make a dropped trigger cost a full
  # hour instead of 30 minutes.
  #
  # To go back to scraping only in the send windows, restore:
  #   - cron: '9,39 0,1,2,3,4,5,13,14,15,16,17,18,19,23 * * *'
  schedule:
    - cron: '9,39 * * * *'

  # Manual trigger for testing.
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the timezone gate and run now'
        type: boolean
        default: true
      dry_run:
        description: 'Scrape and log only - do not send email or save state'
        type: boolean
        default: false
      catchup:
        description: 'One-time: email ALL currently-open jobs as links, in batches'
        type: boolean
        default: false

# Needed to commit state/seen.json back to the repo.
permissions:
  contents: write

# Never let two runs race on the state file.
concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          # Optional: set a repo Variable named DIGEST_TZ to change timezone
          # without editing code. Falls back to config/sources.yaml if unset.
          DIGEST_TZ: ${{ vars.DIGEST_TZ }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run --no-store"; fi
          if [ "${{ inputs.catchup }}" = "true" ]; then ARGS="$ARGS --catchup"; fi
          python -m src.main $ARGS

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen-jobs state [skip ci]"
            # Another slot may have pushed while we ran; rebase and retry once.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state change to commit."
          fi
