name: Job Digest

on:
  # PRIMARY TRIGGER. GitHub's own cron is best-effort and it degraded badly:
  # the schedule below asks for 32 triggers a day, GitHub delivered ~12, then
  # 2 on 2026-08-27 and 2 on 2026-08-28 -- arriving 1-7 hours late, so none
  # landed in a send window and the digest went silent for three days while
  # every run stayed green. An external timezone-aware cron (cron-job.org)
  # POSTs to /dispatches at 06:47 and 18:47 America/New_York, which lands
  # inside the prep window; src/main.py then holds until exactly 07:00/19:00.
  repository_dispatch:
    types: [digest, heartbeat]

  # The digest must LAND at 07:00 and 19:00 Eastern. GitHub Actions cron is
  # UTC-only, ignores DST, and routinely delays triggers by 10-50 minutes, so
  # firing at the target time and hoping produced 09:52-11:50 deliveries for a
  # 09:00 slot. Two mechanisms fix that:
  #
  #  (a) Fire EARLY and often. A window opens `prep_minutes` (25) before its
  #      target, so a run that starts at 06:35 scrapes, dedupes and renders,
  #      then holds the finished email until exactly 07:00. Whichever trigger
  #      lands inside the prep window produces an on-time send; the rest exit
  #      in about two seconds.
  #
  #  (b) src/main.py still sends whenever a slot is "due and not yet sent"
  #      (see due_slot), so if every prep-window trigger is dropped, a later
  #      one still delivers -- just not on the minute.
  #
  # Hours cover both DST offsets, since cron cannot:
  #   07:00 ET target -> prep opens 06:35 ET -> 10:35 UTC (EDT) / 11:35 (EST)
  #   19:00 ET target -> prep opens 18:35 ET -> 22:35 UTC (EDT) / 23:35 (EST)
  # The extra hours are catch-up for badly delayed triggers, bounded by the
  # am_deadline / pm_deadline in config/sources.yaml.
  # FALLBACK ONLY -- see repository_dispatch above. Kept so a cron-job.org
  # outage still has a chance of delivering.
  schedule:
    - cron: '5,20,35,50 10,11,12,13,22,23,0,1 * * *'

  # Manual trigger for testing.
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the timezone gate and run now'
        type: boolean
        default: true
      dry_run:
        description: 'Scrape and log only - do not send email or save state'
        type: boolean
        default: false
      catchup:
        description: 'One-time: email ALL currently-open jobs as links, in batches'
        type: boolean
        default: false
      migrate_keys:
        description: 'One-time: translate seen-state onto the fixed key formats'
        type: boolean
        default: false

# Needed to commit state/seen.json back to the repo.
permissions:
  contents: write

# Never let two runs race on the state file.
concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Generous enough to cover scraping plus the pre-send hold, which can be up
    # to schedule.max_hold_minutes (45) while the run waits for its target time.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # A broken commit must not be able to send a corrupted digest, so the
      # suite gates the send. `live` tests are skipped -- a rate-limited
      # LinkedIn must not stop the morning email going out.
      - name: Run tests
        run: pytest -q -m "not live"

      - name: Run digest
        if: github.event.action != 'heartbeat'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          # Optional: set a repo Variable named DIGEST_TZ to change timezone
          # without editing code. Falls back to config/sources.yaml if unset.
          DIGEST_TZ: ${{ vars.DIGEST_TZ }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run --no-store"; fi
          if [ "${{ inputs.catchup }}" = "true" ]; then ARGS="$ARGS --catchup"; fi
          if [ "${{ inputs.migrate_keys }}" = "true" ]; then ARGS="$ARGS --migrate-keys"; fi
          python -m src.main $ARGS

      - name: Commit updated state
        if: github.event.action != 'heartbeat'
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen-jobs state [skip ci]"
            # Another slot may have pushed while we ran; rebase and retry once.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state change to commit."
          fi

      # Silence is the failure mode this project could not see. A digest that
      # stops sending produces no error, no red run and no email -- an empty
      # inbox is indistinguishable from a quiet week. This step reads the last
      # send date out of state/seen.json and FAILS if it has gone stale, so
      # GitHub's own failure notification becomes the alert.
      #
      # Fired by cron-job.org, deliberately not by GitHub's schedule: a
      # watchdog wired to the mechanism it is watching is no watchdog at all.
      - name: Heartbeat - fail if the digest has gone silent
        if: github.event.action == 'heartbeat'
        run: python -m src.main --check-stale
