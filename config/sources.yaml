# ============================================================================
# Job Digest configuration
#
# Edit this file to change what gets scraped. Everything else is code.
# ============================================================================

# Your timezone. The digest sends at 07:00 and 19:00 local to this zone.
# GitHub Actions cron is UTC-only, so main.py gates on this value instead.
# Examples: America/Los_Angeles, America/New_York, America/Chicago, America/Denver
timezone: America/New_York

# Local hours (24h) at which a digest should LAND in the inbox.
send_hours: [7, 19]

schedule:
  # How early a run may start. GitHub Actions cron drifts 10-50 minutes, so the
  # workflow fires well before the target; the run scrapes, dedupes and renders,
  # then waits out the remainder so the email arrives on the hour rather than
  # whenever the runner happened to boot.
  prep_minutes: 25

  # Safety valve on that wait. If the target is further away than this, send
  # immediately instead of holding a runner idle.
  max_hold_minutes: 45

  # When a window gives up. Without these the morning window ran until the
  # evening one opened, so a morning of dropped triggers could deliver a
  # "morning" digest at 5pm. Past the deadline the slot is skipped and the
  # evening digest picks up its jobs -- they are still new, so nothing is lost.
  am_deadline: "12:00"
  pm_deadline: "23:30"

# ----------------------------------------------------------------------------
# Deduplication
# ----------------------------------------------------------------------------
dedup:
  # Until this date the seen-check ALSO consults the pre-2026-08-13 key formats
  # (see src/canonical_legacy.py). That covers postings which were not in the
  # scrape when `--migrate-keys` ran, such as anything LinkedIn had already
  # aged out of its 24-hour window. Legacy keys are never written.
  #
  # After this date: delete src/canonical_legacy.py and this block.
  legacy_keys_until: "2026-09-15"

# Internship-only mode. When true, new-grad / entry-level / full-time roles are
# filtered out: LinkedIn results must say "intern"/"co-op", and any source's
# obvious new-grad titles ("New Grad", "Graduate Program", "Associate", ...) are
# dropped. Set false to also receive new-grad and entry-level roles.
intern_only: true

# ----------------------------------------------------------------------------
# Relevance -- is this a SOFTWARE job? (intern_only above asks a different
# question: is it an internship? "Tax Intern" passes that one.)
#
# Rules are evaluated in this order, and the first match wins:
#
#   1. block_*          -> DROP (never stored, so loosening a rule brings it back)
#   2. restrict_titles  -> "Maybe" section; the allowlist CANNOT rescue these
#   3. maybe_titles     -> "Maybe" section, unless allow_titles rescues it
#   4. otherwise        -> KEEP
#
# Only step 3 consults allow_titles, because only step 3 is a guess about
# subject matter. A pure blocklist deletes real jobs ("hardware engineer",
# "software quality engineer"); a pure tech allowlist deletes different real
# jobs ("Infrastructure Intern", "Video Algorithms Intern"). Letting the
# allowlist override just the off-domain guess gets both right.
#
# Steps 1 and 2 are facts about the posting, not opinions about its field:
# "AI Engineer (Unpaid Internship)" is obviously an AI job and still unpaid.
#
# ALWAYS preview a change before trusting it:
#     python -m src.main --audit-filter
#     python -m src.main --audit-filter --from tests/fixtures/live_jobs.json
# ----------------------------------------------------------------------------
relevance:
  enabled: true

  # maybe = demote borderline postings to their own section (recommended)
  # drop  = hard-drop them instead
  # off   = keep everything
  mode: maybe

  # Anything that looks like software/data/quant work. Be generous: this list
  # only ever RESCUES a posting the off-domain list below would have demoted,
  # so a false positive here costs one extra row, never a lost job.
  #
  # Deliberately absent: bare "code" (matched "Summer of Code"), "technology"
  # and "IT" (matched "Tax Technology Intern", "IT Audit Intern"), and
  # "trading"/"trader" (matched "Global Markets Sales & Trading Analyst").
  # Genuine quant roles still pass on "quant"/"quantitative".
  allow_titles:
    - '\b(software|swe|sde|developer|programmer|coding)\b'
    - '\b(engineer|engineering)\b'
    - '\b(infrastructure|platform|backend|back[- ]end|frontend|front[- ]end|full[- ]?stack|distributed|systems?)\b'
    - '\b(embedded|firmware|hardware|silicon|asic|fpga|compiler|kernel|operating system|graphics|gameplay|game)\b'
    - '\b(ml|machine\s*learning|ai|artificial intelligence|deep\s*learning|nlp|computer\s*vision|algorithms?|research scientist|applied scientist)\b'
    - '\b(data|analytics|quant|quantitative|statistics|statistical)\b'
    - '\b(security|cyber|devops|sre|cloud|network|mobile|ios|android|web|robotics|autonomy|autonomous|simulation)\b'
    - '\b(computer science)\b'

  # Not real postings, or programs rather than jobs.
  block_titles:
    - '\bgeneral interest\b'
    - '\bskillbridge\b'
    - '\b(summer of code|outreachy)\b'
    - '\b(fellowship|scholars?|student ambassadors?|mentorship program)\b'
    - '\bexpress your interest\b'
    - '\btalent (community|network|pool)\b'
    - '\bjoin our talent\b'

  # Aggregators and reposters that relist other companies' jobs under their own
  # name, so the apply link goes nowhere useful.
  block_companies:
    - '^(genusjob|meeboss)\b'
    - '^jobright'

  block_urls:
    - 'summerofcode\.withgoogle\.com'
    - 'outreachy\.org'
    - 'fellowship\.mlh\.io'
    - 'databricks\.com/university'
    - 'mvp\.microsoft\.com/studentambassadors'
    - 'neo\.com/scholars'

  # Real jobs you cannot actually take. Demoted, and NOT rescuable by
  # allow_titles -- being an AI job does not make an unpaid role paid.
  restrict_titles:
    - '\bunpaid\b'
    - '\bwith\s+(drexel|northeastern|purdue|uiuc|rit|penn state)\b'
    - '\b(students? only|restricted to)\b'

  # Borderline subject matter: demoted to "Maybe" unless allow_titles rescues
  # it. Never silently deleted.
  maybe_titles:
    - '\bresearch park\b'
    - '\b(tax|audit|auditing|accounting|payroll|bookkeep)\b'
    - '\b(human resources|recruiting|recruiter|talent acquisition)\b'
    - '\b(marketing|advertising|public relations|communications|journalism)\b'
    - '\b(sales|business development|account executive|purchasing|procurement|supply chain|logistics|warehouse)\b'
    - '\b(geology|geological|geophysics|petroleum|mining|metallurg)\b'
    - '\b(nurse|nursing|clinical|pharmac|dental|veterinar|social work)\b'
    - '\b(paralegal|legal|attorney|compliance officer)\b'
    - '\b(mechanical|civil|structural|architectural|interior design|culinary|hospitality)\b'

# ----------------------------------------------------------------------------
# Simplify.jobs
#
# Backed by a public Typesense index. Each profile below reproduces one of the
# three Simplify URLs exactly -- every URL filter maps to an index field.
#
# NOTE: the search key is a *public, search-only* scoped key lifted from
# Simplify's own client bundle. If Simplify rotates it, requests start failing
# with 401/403 and you re-extract it -- see README "Simplify key rotation".
# ----------------------------------------------------------------------------
simplify:
  enabled: true
  host: https://js-ha.simplify.jobs
  fallback_hosts:
    - https://js1.simplify.jobs
    - https://js2.simplify.jobs
    - https://js3.simplify.jobs
  collection: jobs
  api_key: ""

  # Anchors used by every profile below (YAML anchors avoid repeating them).
  _anchors:
    categories: &categories
      - Applied Machine Learning
      - Conversational AI & Chatbots
      - Robotics & Autonomous Systems
      - Speech Recognition
      - Deep Learning
      - Natural Language Processing (NLP)
      - Computer Vision
      - AI Research
      - Data Science
      - AI & Machine Learning
      - Quantitative Analysis
      - Algorithm Development
      - Quantitative Research
      - Quantitative Trading
      - Data Analysis
      - Quantitative Finance
      - Data Engineering
      - Data & Analytics
      - Software Engineering
      - Low Level System Software
      - Backend Engineering
      - Full-Stack Engineering
    majors: &majors
      - Computer Science
      - Electrical Engineering
      - Mathematics
      - Statistics
      - Data Science
      - Computer Engineering
      - Applied Mathematics
    experience: &experience
      - Internship
      - Entry Level/New Grad
      - Junior
    education: &education
      - Bachelor's
      - Master's

  profiles:
    # --- Simplify URL #1: majors filter, seasons through 2028 ---
    - name: url1-majors-2027-2028
      enabled: true
      filters:
        type: [Internship]
        countries: [United States]
        experience_level: *experience
        functions: *categories
        majors: *majors
        degrees: *education
        seasons:
          - Summer 2027
          - Winter 2027
          - Spring 2027
          - Fall 2027
          - Winter 2028
          - Summer 2028
          - Spring 2028
          - Fall 2028

    # --- Simplify URL #2: NO majors filter (broader), 2027 seasons only ---
    - name: url2-no-majors-2027
      enabled: true
      filters:
        type: [Internship]
        countries: [United States]
        experience_level: *experience
        functions: *categories
        degrees: *education
        seasons:
          - Summer 2027
          - Winter 2027
          - Spring 2027
          - Fall 2027

    # --- Simplify URL #3: adds Software Development Management category ---
    - name: url3-with-sdm
      enabled: true
      filters:
        type: [Internship]
        countries: [United States]
        experience_level: *experience
        functions:
          - Applied Machine Learning
          - Conversational AI & Chatbots
          - Robotics & Autonomous Systems
          - Speech Recognition
          - Deep Learning
          - Natural Language Processing (NLP)
          - Computer Vision
          - AI Research
          - Data Science
          - AI & Machine Learning
          - Quantitative Analysis
          - Algorithm Development
          - Quantitative Research
          - Quantitative Trading
          - Data Analysis
          - Quantitative Finance
          - Data Engineering
          - Data & Analytics
          - Software Engineering
          - Low Level System Software
          - Backend Engineering
          - Full-Stack Engineering
          - Software Development Management
        majors: *majors
        degrees: *education
        seasons:
          - Summer 2027
          - Winter 2027
          - Spring 2027
          - Fall 2027
          - Winter 2028
          - Spring 2028
          - Summer 2028

# ----------------------------------------------------------------------------
# Pitt CSC x Simplify -- the canonical internship list (46k stars)
#
# The GitHub lists below are smaller derivatives of this one. Measured
# 2026-08-10: 331 of its 547 relevant listings were absent from every other
# source configured here, 15 of them posted within the previous day --
# including Citadel, Figma, PEAK6, LPL Financial, ING and Tesla.
#
# Read from the structured feed that generates its READMEs, not the READMEs:
# the feed carries an exact `date_posted` and an `active` flag, and that repo
# renders HTML <table> markup which a markdown table parser reads as zero jobs.
# ----------------------------------------------------------------------------
simplifyjobs_feed:
  enabled: true
  name: SimplifyJobs
  repo: SimplifyJobs/Summer2027-Internships
  branch: dev
  path: .github/scripts/listings.json
  us_only: true

  # Seasons to accept. Postings the repo tags `N/A` are dropped -- the feed
  # carries off-season and prior-year listings in the same file, so an
  # untagged entry cannot be confirmed as a 2027 role.
  years: ["2027", "2028"]

  # A DENYLIST, not an allowlist -- this is the most important source, so it
  # errs toward letting a posting through and judging it on its title.
  #
  # Listing only the wanted categories silently dropped everything Simplify
  # filed elsewhere, and "Hardware" turned out to hold two literal "Software
  # Engineer Intern - Summer 2027" postings at RTX, an Embedded Software Co-op,
  # a Flight Software Intern, Tesla firmware, and FPGA roles at DRW, Optiver,
  # Virtu, HPR and Kepler. Simplify can also invent a category name whenever it
  # likes, and an allowlist would drop that one too, silently.
  #
  # Product management is a genuinely different job, so it stays out. Anything
  # unrecognised is INCLUDED and logged, then filtered on its title by the
  # `relevance:` rules above.
  exclude_categories:
    - Product
    - Product Management

# ----------------------------------------------------------------------------
# GitHub markdown job lists
#
# All three repos publish the same broad table shape, so one parser handles
# them. Fetched from raw.githubusercontent.com, not the rendered HTML page.
# ----------------------------------------------------------------------------
github_lists:
  enabled: true
  sources:
    - name: vanshb03-offseason
      enabled: true
      repo: vanshb03/Summer2027-Internships
      branch: dev
      path: OFFSEASON_README.md

    # Extra list (not one of the 7 URLs given). Set enabled:false to drop.
    - name: vanshb03-summer2027
      enabled: true
      repo: vanshb03/Summer2027-Internships
      branch: dev
      path: README.md

    - name: sndsh404
      enabled: true
      repo: sndsh404/summer-2027-internships
      branch: main
      path: README.md
      # Headings whose tables are not job listings. "programs always open" is
      # Google Summer of Code and Outreachy -- programmes, not postings.
      #
      # NOT listed: "programs open now", which mixes that sort of entry with
      # three real Apple internships. Skipping it would lose them; the
      # relevance rules filter it row by row instead.
      skip_sections:
        - '^programs always open$'
        - '^open source programs$'
        - '^research programs'

    - name: speedyapply-intern-usa
      enabled: true
      repo: speedyapply/2027-SWE-College-Jobs
      branch: main
      path: README.md

    # New-grad list — disabled because you're targeting internships only.
    # Flip to true (and set intern_only: false above) to include new-grad roles.
    - name: speedyapply-newgrad-usa
      enabled: false
      repo: speedyapply/2027-SWE-College-Jobs
      branch: main
      path: NEW_GRAD_USA.md

# ----------------------------------------------------------------------------
# LinkedIn
#
# The logged-out guest API works, but LinkedIn gates the external apply URL
# behind a sign-in modal. These entries therefore link to LinkedIn and are
# rendered in their own clearly-labelled email section.
# ----------------------------------------------------------------------------
linkedin:
  enabled: true
  keywords: software engineer intern
  f_E: "1"          # experience level: internship
  f_TPR: r86400     # posted in last 24h
  sort_by: DD       # most recent first
  max_pages: 6      # 25 results per page
  # No geo filter was being sent at all, so results were worldwide. geoId is
  # the parameter LinkedIn actually filters on; 103644278 is the United States.
  location: "United States"
  geo_id: "103644278"
  us_only: true     # post-filter too, in case the guest API ignores geoId
