# ============================================================================
# Job Digest configuration
#
# Edit this file to change what gets scraped. Everything else is code.
# ============================================================================

# Your timezone. The digest sends at 09:00 and 19:00 local to this zone.
# GitHub Actions cron is UTC-only, so main.py gates on this value instead.
# Examples: America/Los_Angeles, America/New_York, America/Chicago, America/Denver
timezone: America/New_York

# Local hours (24h) at which a digest should send.
send_hours: [9, 19]

# Sources are scraped every hour, but email still goes out only at send_hours.
# Anything found in between is held in state/seen.json's `pending` queue and
# delivered with the next digest, so a posting that drops at 10:14am is caught
# within the hour instead of waiting for the next 12-hourly scrape.

# Noise filter. Widening the sources to stop missing postings also let in
# listings worth nobody's time -- campus student-worker jobs, baristas, and
# untagged postings from companies no one has heard of. When true:
#
#   * any posting whose title names no technical work at all is dropped
#   * a posting whose SEASON IS UNTAGGED is kept only if its employer is one
#     worth not missing (see NOTABLE_EMPLOYERS in src/relevance.py)
#
# Postings whose season IS tagged are never touched -- they already passed a
# category filter at the source, and they are the bulk of every digest.
#
# On a live run this dropped 9 non-technical titles and 92 untagged postings
# from unrecognised employers, while keeping the untagged ByteDance, Jane
# Street, Anthropic, Point72, Zoox, Prime Intellect and Elicit listings.
# Set false to see everything the sources return.
filter_noise: true

# Internship-only mode. When true, new-grad / entry-level / full-time roles are
# filtered out: LinkedIn results must say "intern"/"co-op", and any source's
# obvious new-grad titles ("New Grad", "Graduate Program", "Associate", ...) are
# dropped. Set false to also receive new-grad and entry-level roles.
intern_only: true

# ----------------------------------------------------------------------------
# Simplify.jobs
#
# Backed by a public Typesense index. Each profile below reproduces one of the
# three Simplify URLs exactly -- every URL filter maps to an index field.
#
# NOTE: the search key is a *public, search-only* scoped key lifted from
# Simplify's own client bundle. If Simplify rotates it, requests start failing
# with 401/403 and you re-extract it -- see README "Simplify key rotation".
# ----------------------------------------------------------------------------
simplify:
  enabled: true
  host: https://js-ha.simplify.jobs
  fallback_hosts:
    - https://js1.simplify.jobs
    - https://js2.simplify.jobs
    - https://js3.simplify.jobs
  collection: jobs
  api_key: ""

  # Anchors used by every profile below (YAML anchors avoid repeating them).
  _anchors:
    categories: &categories
      - Applied Machine Learning
      - Conversational AI & Chatbots
      - Robotics & Autonomous Systems
      - Speech Recognition
      - Deep Learning
      - Natural Language Processing (NLP)
      - Computer Vision
      - AI Research
      - Data Science
      - AI & Machine Learning
      - Quantitative Analysis
      - Algorithm Development
      - Quantitative Research
      - Quantitative Trading
      - Data Analysis
      - Quantitative Finance
      - Data Engineering
      - Data & Analytics
      - Software Engineering
      - Low Level System Software
      - Backend Engineering
      - Full-Stack Engineering
    majors: &majors
      - Computer Science
      - Electrical Engineering
      - Mathematics
      - Statistics
      - Data Science
      - Computer Engineering
      - Applied Mathematics
    experience: &experience
      - Internship
      - Entry Level/New Grad
      - Junior
    education: &education
      - Bachelor's
      - Master's

  # Every filter below is an AND-gate against Simplify's own tagging, so each
  # one can only ever REMOVE postings. Measured against the live index on
  # 2026-08-10, for US internships in the categories above with 2027 seasons:
  #
  #     327  no majors/degrees requirement
  #     261  + degrees=[Bachelor's, Master's]     <- lost 66 real postings
  #     255  + majors=[CS, EE, Math, ...]         <- lost 6 more
  #
  # A posting is excluded not for being the wrong degree but for having no
  # degree tagged at all, which is common on brand-new entries. Both filters
  # are therefore gone; `type`, `countries`, `functions` and `seasons` are the
  # only gates left. `experience_level` was dropped too -- every posting under
  # type=Internship already has experience_level=Internship, so it filtered
  # nothing while adding another way to be wrongly excluded.
  profiles:
    # --- 2027 and 2028 seasons, the roles actually being targeted ---
    - name: us-intern-2027-2028
      enabled: true
      filters:
        type: [Internship]
        countries: [United States]
        functions: *categories
        seasons:
          - Summer 2027
          - Winter 2027
          - Spring 2027
          - Fall 2027
          - Winter 2028
          - Summer 2028
          - Spring 2028
          - Fall 2028

    # --- Untagged season ---
    # 5,983 US internships in the index carry season "N/A", and new postings
    # are the likeliest to be untagged -- exactly the ones this digest exists
    # to catch. They cannot be confirmed as 2027 roles, so they are collected
    # and flagged; the email puts them in their own section.
    - name: us-intern-untagged-season
      enabled: true
      unconfirmed: true
      filters:
        type: [Internship]
        countries: [United States]
        functions: *categories
        seasons: ["N/A"]

    # --- No country tag ---
    # Dropping `countries` raises the 2027 count by ~43. Some of those are
    # foreign, but some are US-remote postings with no country tagged. Caught
    # here and flagged rather than lost to the countries gate.
    - name: intern-untagged-country
      enabled: true
      unconfirmed: true
      filters:
        type: [Internship]
        functions: *categories
        seasons:
          - Summer 2027
          - Winter 2027
          - Spring 2027
          - Fall 2027

# ----------------------------------------------------------------------------
# Pitt CSC x Simplify -- the canonical internship list (46k stars)
#
# The other GitHub repos below are smaller derivatives of this one. It is read
# from the structured feed that generates its READMEs rather than the READMEs
# themselves: the feed carries an exact `date_posted` epoch and an `active`
# flag, and it does not break when the README markup changes (that repo now
# renders HTML <table> markup, which a markdown table parser reads as zero
# jobs).
#
# Measured 2026-08-10: 331 of 547 relevant listings in this feed were absent
# from every other configured source -- 15 of them posted within the last day.
# ----------------------------------------------------------------------------
simplifyjobs_feed:
  enabled: true
  name: SimplifyJobs
  repo: SimplifyJobs/Summer2027-Internships
  branch: dev
  path: .github/scripts/listings.json
  us_only: true
  # Seasons to accept. Postings with no season tagged are kept and flagged
  # `unconfirmed` rather than dropped -- see src/scrapers/simplify_repo.py.
  years: ["2027", "2028"]
  # The feed's own `category` vocabulary. Hardware/Product are excluded to
  # match the software / AI / quant focus; add them here to widen.
  categories:
    - Software
    - Software Engineering
    - AI/ML/Data
    - Data Science, AI & Machine Learning
    - Quant

# ----------------------------------------------------------------------------
# GitHub markdown job lists
#
# All three repos publish the same broad table shape, so one parser handles
# them. Fetched from raw.githubusercontent.com, not the rendered HTML page.
# ----------------------------------------------------------------------------
github_lists:
  enabled: true
  sources:
    - name: vanshb03-offseason
      enabled: true
      repo: vanshb03/Summer2027-Internships
      branch: dev
      path: OFFSEASON_README.md

    # Extra list (not one of the 7 URLs given). Set enabled:false to drop.
    - name: vanshb03-summer2027
      enabled: true
      repo: vanshb03/Summer2027-Internships
      branch: dev
      path: README.md

    - name: sndsh404
      enabled: true
      repo: sndsh404/summer-2027-internships
      branch: main
      path: README.md

    - name: speedyapply-intern-usa
      enabled: true
      repo: speedyapply/2027-SWE-College-Jobs
      branch: main
      path: README.md

    # New-grad list — disabled because you're targeting internships only.
    # Flip to true (and set intern_only: false above) to include new-grad roles.
    - name: speedyapply-newgrad-usa
      enabled: false
      repo: speedyapply/2027-SWE-College-Jobs
      branch: main
      path: NEW_GRAD_USA.md

# ----------------------------------------------------------------------------
# LinkedIn
#
# The logged-out guest API works, but LinkedIn gates the external apply URL
# behind a sign-in modal. These entries therefore link to LinkedIn and are
# rendered in their own clearly-labelled email section.
# ----------------------------------------------------------------------------
linkedin:
  enabled: true

  # Several queries, because one phrasing does not find the others. LinkedIn
  # matches keywords fairly literally, so "Summer Analyst" (how most quant and
  # bank tech roles are titled) never appears in a "software engineer intern"
  # search. Results are unioned and deduped by job URL.
  # Measured yield per query on a live 24h window (2026-08-10): "software
  # engineer intern" 250 new, "machine learning intern" 243, "data science
  # intern" 185, "quantitative intern" 80. "software engineering intern" and
  # "software developer intern" each returned 0 new -- LinkedIn's matching is
  # loose enough that they retrieve the same set as the first query -- so they
  # are omitted rather than spending the request budget twice for nothing.
  keywords:
    - software engineer intern
    - machine learning intern
    - data science intern
    - quantitative intern
    - summer analyst technology

  f_E: "1"          # experience level: internship
  f_TPR: r86400     # posted in last 24h
  sort_by: DD       # most recent first

  # United States. Without this LinkedIn searches worldwide.
  geo_id: "103644278"

  # LinkedIn returns 10 cards per request, NOT the 25 the parameter name
  # implies. Measured 2026-08-10: a single 24h "software engineer intern"
  # query had 300+ unique results still paginating, while max_pages:6 stopped
  # at 60 -- so 80% of LinkedIn was never seen. Raised, with a total budget
  # across all queries so a runaway page count cannot blow the job timeout.
  # Frequency substitutes for depth here. Results are sorted newest-first, and
  # the digest now runs every 30 minutes, so reading the newest ~60 per query
  # each run covers far more ground over a day than one deep 300-result sweep
  # twice a day did -- and the seen-store absorbs the overlap between runs.
  #
  # Keeping the per-run budget small matters: at 48 runs a day, a 110-request
  # budget would mean over 5,000 LinkedIn requests daily from a shared GitHub
  # runner IP, which is how a scraper gets blocked outright. This caps a run at
  # ~35 requests (~45 seconds). max_pages is per query, so the budget divides
  # evenly across the five rather than being spent entirely on the first.
  max_pages: 6
  max_total_requests: 35
  page_delay_seconds: 1.2
