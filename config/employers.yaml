# ============================================================================
# Employers worth emailing about
#
# The bar: a Summer 2027 SWE internship here must be at least as strong a
# resume line as the Capital One SWE internship already in hand. Capital One
# itself is deliberately absent -- another posting there is not news.
#
# A posting from a company NOT on this list is dropped before the email is
# built, silently. Dropped postings are never recorded as seen, so adding a
# company here brings back its currently-open postings on the very next run.
#
# To see which unlisted companies had software postings (terminal only, never
# emailed):
#     python -m src.main --audit-filter
#
# FORMAT: a plain name, or `Name: [alias, alias]` for the other spellings the
# sources use. Matching is EXACT after normalisation (case, punctuation,
# spacing, "Inc"/"LLC"/"Technologies"/"Group"/... and any "(...)" suffix are
# ignored), never a substring -- so "Apple" does not match "Applied Materials".
# Two entries that normalise to the same name fail loudly at load.
#
# The groups are for reading only; every group is treated the same.
# ============================================================================

